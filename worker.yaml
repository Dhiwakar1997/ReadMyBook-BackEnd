identity:
  type: SystemAssigned

properties:
  configuration:
    activeRevisionsMode: Single
    registries:
      - server: rmbacrdev.azurecr.io
        identity: system
    secrets:
      - name: qdrant-url
        identity: system
        keyVaultUrl: https://rmb-key-dev.vault.azure.net/secrets/qdrant-url
      - name: queue-name
        identity: system
        keyVaultUrl: https://rmb-key-dev.vault.azure.net/secrets/queue-name
      - name: storage-connection-string
        identity: system
        keyVaultUrl: https://rmb-key-dev.vault.azure.net/secrets/storage-connection-string
      - name: database-url
        identity: system
        keyVaultUrl: https://rmb-key-dev.vault.azure.net/secrets/database-url
      - name: openai-api-key
        identity: system
        keyVaultUrl: https://rmb-key-dev.vault.azure.net/secrets/openai-api-key
      - name: qdrant-key
        identity: system
        keyVaultUrl: https://rmb-key-dev.vault.azure.net/secrets/qdrant-key

  template:
    containers:
      - name: rmb-ca-worker-dev
        image: rmbacrdev.azurecr.io/readmybook-worker:v1.0.0
        resources:
          cpu: 4
          memory: 8Gi
        env:
          - name: DATABASE_URL
            secretRef: database-url
          - name: AZURE_CONNECTION_STRING
            secretRef: storage-connection-string
          - name: QUEUE_NAME
            secretRef: queue-name
          - name: OPENAI_API_KEY
            secretRef: openai-api-key
          - name: QDRANT_URL
            secretRef: qdrant-url
          - name: QDRANT_KEY
            secretRef: qdrant-key

    scale:
      minReplicas: 0
      maxReplicas: 20
      pollingInterval: 30
      cooldownPeriod: 100
      rules:
        - name: azure-queue-scale
          azureQueue:
            accountName: rmbblobcindev
            queueName: pdf-to-md
            queueLength: 3
            identity: system